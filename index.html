<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efeaff">
  <meta name="color-scheme" content="light">

  <title>Kiara &lt;3</title>
  <meta name="description" content="Una dedicatoria especial hecha con amor para ti.">
  <meta name="robots" content="noindex, nofollow">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Para Kiara">
  <meta property="og:title" content="Kiara &lt;3">
  <meta property="og:description" content="Una dedicatoria especial hecha con amor para ti.">
  <meta property="og:locale" content="es_ES">
  <meta property="og:image" content="https://kiaura.netlify.app/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Kiara: una dedicatoria especial hecha con amor para ti">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kiara &lt;3">
  <meta name="twitter:description" content="Una dedicatoria especial hecha con amor para ti.">
  <meta name="twitter:image" content="https://kiaura.netlify.app/assets/og-image.png">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='.5' stop-color='%238b5cf6'/%3E%3Cstop offset='.5' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kiara">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preload" href="assets/fonts/quicksand-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/pacifico-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="grad-heart" x1="0" y1="0" x2="1" y2="0">
        <stop offset="49.9%" stop-color="#8b5cf6"/>
        <stop offset="50.1%" stop-color="#38bdf8"/>
      </linearGradient>
    </defs>
  </svg>

  <noscript>
    <div class="no-js">
      <div>
        <p>JavaScript requerido</p>
        <span>Activa JavaScript para ver esta dedicatoria.</span>
      </div>
    </div>
  </noscript>

  <section class="screen screen--intro" id="screen-intro" aria-label="Portada" hidden>
    <button class="intro" id="intro-trigger" type="button">
      <span class="intro__heart">
        <svg viewBox="0 0 1280 1228" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
          <g transform="translate(0,1228) scale(0.1,-0.1)" fill="url(#grad-heart)" stroke="none">
            <path d="M3580 10519 c-418 -47 -855 -233 -1197 -510 -191 -155 -415 -411 -552 -631 -303 -485 -468 -1037 -512 -1713 -76 -1171 375 -2000 1524 -2802 212 -148 408 -273 822 -523 570 -344 790 -490 1082 -717 659 -511 1296 -1213 1537 -1693 29 -58 58 -121 65 -140 l13 -35 18 50 c139 397 809 1167 1560 1795 329 275 617 476 1240 865 743 464 1044 683 1364 995 484 471 737 947 833 1567 24 155 24 661 0 863 -59 490 -166 864 -357 1240 -135 265 -301 491 -511 695 -369 358 -792 567 -1309 647 -133 20 -528 17 -665 -5 -787 -131 -1435 -583 -1911 -1332 -64 -100 -179 -313 -229 -426 l-39 -86 -101 201 c-55 111 -137 260 -182 332 -497 793 -1205 1275 -2008 1364 -105 12 -378 11 -485 -1z"/>
          </g>
        </svg>
      </span>
      <span class="intro__label" id="intro-label">Dale click, Kiara</span>
      <span class="intro__hint" id="intro-hint">toca el corazón</span>
    </button>
  </section>

  <section class="screen screen--gate" id="screen-gate" aria-hidden="true" hidden>
    <div class="gate" id="gate-card" role="dialog" aria-modal="true" aria-labelledby="gate-title">
      <span class="gate__badge" id="gate-eyebrow">Antes de empezar</span>
      <h1 class="gate__title" id="gate-title"></h1>
      <div class="gate__text" id="gate-text"></div>
      <div class="gate__actions">
        <button class="gate__btn gate__btn--yes" id="gate-yes" type="button">Sí</button>
        <button class="gate__btn gate__btn--no" id="gate-no" type="button">No</button>
      </div>
      <p class="gate__reply" id="gate-reply" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section class="screen screen--tree" id="screen-tree" aria-hidden="true" hidden>
    <main class="love-container">
      <section class="counter-container" aria-live="off">
        <p>Nuestro tiempo juntos...</p>
        <div id="love-counter"></div>
      </section>

      <div class="tree-container">
        <div class="full-tree-wrapper">
          <canvas id="love-tree-canvas" width="1100" height="680" role="img"
                  aria-label="Un árbol dibujado con corazones para ti."></canvas>
        </div>
      </div>

      <button class="carta-button" id="letters-button" type="button"
              aria-label="Abrir las cartas" aria-haspopup="dialog">
        <span class="carta-inner">
          <svg class="carta-heart" viewBox="0 0 1280 1228" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
            <g transform="translate(0,1228) scale(0.1,-0.1)" fill="url(#grad-heart)" stroke="none">
              <path d="M3580 10519 c-418 -47 -855 -233 -1197 -510 -191 -155 -415 -411 -552 -631 -303 -485 -468 -1037 -512 -1713 -76 -1171 375 -2000 1524 -2802 212 -148 408 -273 822 -523 570 -344 790 -490 1082 -717 659 -511 1296 -1213 1537 -1693 29 -58 58 -121 65 -140 l13 -35 18 50 c139 397 809 1167 1560 1795 329 275 617 476 1240 865 743 464 1044 683 1364 995 484 471 737 947 833 1567 24 155 24 661 0 863 -59 490 -166 864 -357 1240 -135 265 -301 491 -511 695 -369 358 -792 567 -1309 647 -133 20 -528 17 -665 -5 -787 -131 -1435 -583 -1911 -1332 -64 -100 -179 -313 -229 -426 l-39 -86 -101 201 c-55 111 -137 260 -182 332 -497 793 -1205 1275 -2008 1364 -105 12 -378 11 -485 -1z"/>
            </g>
          </svg>
          <span class="carta-label">Cartas</span>
        </span>
      </button>
    </main>

    <div class="fullscreen-control" id="fullscreen-control">
      <button class="fullscreen-btn" id="fullscreen-btn" type="button" aria-label="Entrar en pantalla completa">
        <svg id="fullscreen-enter-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M5 5h6v2H7v4H5V5zm12 0h2v6h-2V7h-4V5h4zM5 13h2v4h4v2H5v-6zm12 4v-4h2v6h-6v-2h4z"/>
        </svg>
        <svg id="fullscreen-exit-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="is-hidden"
             style="fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:square;stroke-linejoin:round;">
          <path d="M8 3V8H3M16 3V8H21M8 21V16H3M16 21V16H21"/>
        </svg>
      </button>
    </div>

    <div class="player" id="player">
      <div class="player__top">
        <span class="player__title" id="player-title"></span>
        <span class="player__time" id="player-time">0:00</span>
      </div>

      <div class="player__controls">
        <button class="player__btn" id="player-prev" type="button" aria-label="Canción anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 5h2v14H6zm12 0v14l-9-7z"/>
          </svg>
        </button>

        <button class="player__btn player__btn--play" id="player-toggle" type="button"
                aria-label="Reproducir" aria-pressed="false">
          <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="pause-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="is-hidden">
            <path d="M6 19h4V5H6zm8-14v14h4V5z"/>
          </svg>
        </button>

        <button class="player__btn" id="player-next" type="button" aria-label="Siguiente canción">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M16 5h2v14h-2zM6 5l9 7-9 7z"/>
          </svg>
        </button>

        <div class="player__bar" id="player-bar" role="slider" tabindex="0"
             aria-label="Progreso de la canción" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="player__fill" id="player-fill"></div>
        </div>

        <button class="player__btn player__btn--small" id="player-volume-btn" type="button"
                aria-label="Volumen" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/>
          </svg>
        </button>
      </div>

      <div class="player__volume" id="player-volume">
        <input type="range" id="player-volume-range" min="0" max="1" step="0.01" value="0.15"
               aria-label="Volumen de la música">
      </div>
    </div>

    <audio id="background-music" preload="metadata" playsinline></audio>
  </section>

  <div class="letters" id="letters-panel" role="dialog" aria-modal="true"
       aria-labelledby="letters-heading" aria-hidden="true" hidden>
    <div class="letters__shell">
      <aside class="letters__side">
        <div class="letters__side-head">
          <div>
            <h2 class="letters__heading" id="letters-heading">Mis Cartas</h2>
            <p class="letters__sub">Selecciona una para leer</p>
          </div>
          <button class="letters__add" id="letters-add" type="button" aria-label="Escribir una carta nueva" hidden>
            <span aria-hidden="true">+</span>
          </button>
        </div>
        <nav class="letters__list" id="letters-list" aria-label="Cartas guardadas"></nav>
        <p class="letters__empty" id="letters-empty" hidden>Todavía no hay cartas guardadas.</p>
      </aside>

      <section class="letters__main" id="letters-main">
        <button class="letters__close" id="letters-close" type="button" aria-label="Cerrar las cartas">&times;</button>

        <article class="letter" id="letter-view">
          <header class="letter__head">
            <p class="letter__meta" id="letter-date"></p>
            <h3 class="letter__title" id="letter-title"></h3>
          </header>
          <div class="letter__body" id="letter-text"></div>
          <div class="photo-stack" id="letter-photos"></div>
          <div class="letter__tools">
            <button class="letters__mini" id="letter-delete" type="button" hidden>Borrar carta</button>
          </div>
        </article>

        <form class="letter-form" id="letter-form" hidden novalidate>
          <h3 class="letter-form__title" id="letter-form-heading">Nueva carta</h3>

          <label class="field">
            <span class="field__label">Título</span>
            <input class="field__input" id="letter-form-title" type="text" maxlength="60"
                   placeholder="Para ti..." autocomplete="off">
          </label>

          <label class="field">
            <span class="field__label">Mensaje</span>
            <textarea class="field__input field__input--area" id="letter-form-text" rows="7"
                      placeholder="Escribe lo que sientes..."></textarea>
          </label>

          <div class="field">
            <span class="field__label">Fotos</span>
            <label class="upload" for="letter-form-photos">
              <span class="upload__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                  <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V15"/>
                </svg>
              </span>
              <span class="upload__text">Añadir fotos</span>
              <input class="upload__input" id="letter-form-photos" type="file" accept="image/*" multiple>
            </label>
            <div class="thumbs" id="letter-form-thumbs"></div>
          </div>

          <p class="letter-form__error" id="letter-form-error" role="alert"></p>

          <div class="letter-form__actions">
            <button class="btn btn--ghost" id="letter-form-cancel" type="button">Cancelar</button>
            <button class="btn btn--primary" id="letter-form-save" type="submit">Guardar carta</button>
          </div>
        </form>
      </section>
    </div>
  </div>

  <script defer src="assets/js/store.js"></script>
  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/letters-data.js"></script>
  <script defer src="assets/js/tree.js"></script>
  <script defer src="assets/js/effects.js"></script>
  <script defer src="assets/js/audio.js"></script>
  <script defer src="assets/js/fullscreen.js"></script>
  <script defer src="assets/js/letters.js"></script>
  <script defer src="assets/js/flow.js"></script>
  <script defer src="assets/js/main.js"></script>
</body>
</html>
